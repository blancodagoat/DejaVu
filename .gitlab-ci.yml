# Build and test on GitLab. The repository here is a mirror: commits land on
# git.blancodagoat.dev first and are pushed across, so this file is edited there too.
#
# This proves every push still passes the tests and still publishes, and keeps both builds as
# pipeline artifacts. It does not publish releases: those are made on git.blancodagoat.dev and
# copied over, so the files on both hosts are the same bytes.
#
# A branch push only builds when something that can change the app changed, because the free
# tier has a monthly budget of build minutes. A tag always builds.

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - .gitlab-ci.yml
        - src/**/*
        - tests/**/*

build:
  tags:
    - saas-windows-medium-amd64
  variables:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"
    NUGET_PACKAGES: $CI_PROJECT_DIR\.nuget
  cache:
    key: nuget-$CI_COMMIT_REF_SLUG
    paths:
      - .nuget
  before_script:
    # The runner image ships an older SDK; the project targets .NET 10.
    - '[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12'
    - Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile dotnet-install.ps1 -UseBasicParsing
    - .\dotnet-install.ps1 -Channel 10.0 -InstallDir "$env:CI_PROJECT_DIR\.dotnet"
    - $env:DOTNET_ROOT = "$env:CI_PROJECT_DIR\.dotnet"
    - $env:PATH = "$env:DOTNET_ROOT;$env:PATH"
    - dotnet --version
  script:
    - dotnet run --project tests/DejaVu.Tests
    - dotnet publish src/DejaVu/DejaVu.csproj -c Release -p:SelfContained=false -o publish/framework-dependent
    - dotnet publish src/DejaVu/DejaVu.csproj -c Release -o publish/self-contained
    - Copy-Item publish/self-contained/DejaVu.exe DejaVu-self-contained.exe
    - Copy-Item publish/framework-dependent/DejaVu.exe DejaVu.exe
  artifacts:
    name: DejaVu-$CI_COMMIT_SHORT_SHA
    paths:
      - DejaVu.exe
      - DejaVu-self-contained.exe
    expire_in: 30 days
