name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet run --project tests/DejaVu.Tests

      - name: Publish (framework-dependent)
        run: dotnet publish src/DejaVu/DejaVu.csproj -c Release -p:SelfContained=false -o publish/framework-dependent

      - name: Publish (self-contained)
        run: dotnet publish src/DejaVu/DejaVu.csproj -c Release -o publish/self-contained

      - name: Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
        run: |
          Copy-Item publish/self-contained/DejaVu.exe DejaVu-self-contained.exe
          gh release delete $env:TAG --yes --cleanup-tag
          if ($LASTEXITCODE -ne 0) { "no previous release to replace" }
          # The tag ref must not exist when the release is created: from Actions, a
          # release on a pre-existing tag trips workflow-scope enforcement (HTTP 403)
          # once the release span touches .github/workflows. Recreating the tag via
          # the release itself is the same path the rolling latest release takes.
          gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$env:TAG"
          if ($LASTEXITCODE -ne 0) { "tag ref already absent" }
          gh release create $env:TAG publish/framework-dependent/DejaVu.exe DejaVu-self-contained.exe --target $env:GITHUB_SHA --generate-notes

      - name: Submit to winget-pkgs
        # Lives here rather than in a release-triggered workflow: releases created with
        # GITHUB_TOKEN never fire other workflows, by GitHub's recursion rule. One-time
        # setup: a WINGET_TOKEN secret (classic PAT, public_repo scope) and an initial
        # `wingetcreate new` submission of blancodagoat.DejaVu; from then on every tag
        # auto-submits the update.
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) { Write-Host "WINGET_TOKEN secret not set; skipping."; exit 0 }
          $version = $env:TAG.TrimStart("v")
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $out = ./wingetcreate.exe update blancodagoat.DejaVu --version $version `
            --urls "https://github.com/blancodagoat/DejaVu/releases/download/$($env:TAG)/DejaVu.exe" `
            --submit --token $env:WINGET_TOKEN 2>&1
          $out | Write-Host
          if ($LASTEXITCODE -ne 0 -and "$out" -match "does not exist|not found") {
            Write-Host "Package not in winget-pkgs yet (initial submission still in review); skipping."
            exit 0
          }
          exit $LASTEXITCODE
