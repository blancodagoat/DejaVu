# Submits each tagged release to microsoft/winget-pkgs, so `winget install DejaVu`
# stays current with zero clicks. Two one-time prerequisites:
#   1. A classic PAT with the public_repo scope, saved as the WINGET_TOKEN repo secret.
#   2. The package must already exist in winget-pkgs; submit the first version once with
#      `wingetcreate new https://github.com/blancodagoat/DejaVu/releases/download/v1.1.0/DejaVu.exe`
#      (id: blancodagoat.DejaVu). After that PR merges, this workflow handles every update.
# The rolling "latest" release is ignored: winget needs immutable versioned URLs.
name: winget

on:
  release:
    types: [published]

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: windows-latest
    steps:
      - name: Submit version update to winget-pkgs
        # Tag and token flow in via env, never interpolated into the script: a tag
        # name is event input, and inlining it would allow expression injection.
        env:
          TAG: ${{ github.event.release.tag_name }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) { Write-Host "WINGET_TOKEN secret not set; skipping submission."; exit 0 }
          $version = $env:TAG.TrimStart("v")
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe update blancodagoat.DejaVu --version $version `
            --urls "https://github.com/blancodagoat/DejaVu/releases/download/$($env:TAG)/DejaVu.exe" `
            --submit --token $env:WINGET_TOKEN
